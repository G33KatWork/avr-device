# Configuration change protection (CCP) description for this chip.
#
# The ATDF/SVD files do not encode which registers are CCP protected, so the
# list is maintained here by hand, from "Table 5-2. Signatures Recognized by
# the Configuration Change Protection Register" in the ATtiny4/5/9/10
# datasheet (Atmel-8127 / DS40002060).
#
# This reduced-core (AVRrc) tinyAVR only recognizes the 0xD8 (IOREG)
# signature; there is no SPM signature. The protected registers live in the
# CPU and WDT blocks instead of the CLKCTRL/WDT peripherals of the modern
# (xmega based) parts.
avr_config:
  ccp:
    unlock_register: "CPU.CCP"
    protected_registers:
      - { register: "CPU.CLKMSR", magic: 0xD8 }
      - { register: "CPU.CLKPSR", magic: 0xD8 }
      - { register: "WDT.WDTCSR", magic: 0xD8 }
